name: workshop-api
services:
  backend:
    image: workshop-backend:${IMAGE_TAG:-local}
    build: .
    restart: unless-stopped
    init: true
    env_file:
      - ${BACKEND_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      PORT: "5000"
    ports:
      - "127.0.0.1:5000:5000"
    networks:
      - database
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
networks:
  database:
    external: true
    name: ${DATABASE_NETWORK:-workshop-network}
