name: workshop

# Local development credentials only.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: workshop
      POSTGRES_USER: workshop
      POSTGRES_PASSWORD: local_workshop_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workshop -d workshop"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      PORT: "5000"
      DATABASE_URL: postgres://workshop:local_workshop_password@db:5432/workshop
      DB_SSL: "false"
      JWT_SECRET: local-development-secret-replace-before-production-12345
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm run migrate:up && npm start"

volumes:
  postgres_data:
